[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "resume-extractor"
version = "0.1.0"
description = "A modern, asynchronous AI-powered Resume Extractor and Parser service"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Developer", email = "developer@example.com" }
]
keywords = ["resume", "extractor", "parser", "fastapi", "llm", "ocr", "nlp", "pydantic"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "fastapi>=0.111.0,<0.112.0",
    "uvicorn[standard]>=0.30.0,<0.31.0",
    "python-multipart>=0.0.9,<0.1.0",
    "pydantic>=2.7.0,<3.0.0",
    "pydantic-settings>=2.3.0,<3.0.0",
    "sqlalchemy>=2.0.30,<2.1.0",
    "asyncpg>=0.29.0,<0.30.0",
    "psycopg2-binary>=2.9.9,<3.0.0",
    "alembic>=1.13.0,<2.0.0",
    "pypdf>=4.2.0,<5.0.0",
    "pdfplumber>=0.11.0,<0.12.0",
    "python-docx>=1.1.0,<2.0.0",
    "pdf2image>=1.17.0,<2.0.0",
    "pytesseract>=0.3.10,<0.4.0",
    "Pillow>=10.3.0,<11.0.0",
    "google-genai>=0.1.0",
    "openai>=1.30.0,<2.0.0",
    "instructor>=1.3.0,<2.0.0",
    "spacy>=3.7.0,<4.0.0",
    "python-dotenv>=1.0.1,<2.0.0",
    "httpx>=0.27.0,<0.28.0",
    "loguru>=0.7.2,<0.8.0",
    "aiofiles>=23.2.0,<24.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0,<9.0.0",
    "pytest-asyncio>=0.23.0,<0.24.0",
    "black>=24.4.0,<25.0.0",
    "ruff>=0.4.0,<0.5.0",
    "mypy>=1.10.0,<2.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ['py310', 'py311', 'py312']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | \.dist
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "ASYNC"]
ignore = []

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --import-mode=importlib"
testpaths = ["tests"]
asyncio_mode = "auto"
